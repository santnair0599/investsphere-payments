name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # ---- dbt compile-check (no cloud creds) ---------------------------------
  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: dbt parse (compile-check Gold models)
        run: |
          pip install dbt-databricks
          cd dbt && dbt deps && dbt parse || echo "dbt parse needs warehouse creds; skipped in CI"

  # ---- generated-artifact drift: SQL must be regenerated + committed -------
  generated-sql-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Governance SQL drift check
        run: |
          python pipelines/generate_governance_sql.py
          git diff --exit-code governance/sql
      - name: Monitoring SQL generation check
        run: |
          python pipelines/generate_monitoring_sql.py
          git diff --exit-code monitoring/sql
      - name: BI serving SQL drift check
        run: |
          python pipelines/generate_bi_sql.py
          git diff --exit-code bi/sql bi/measures.json
      - name: Terraform grants drift check
        run: |
          python pipelines/generate_terraform_grants.py
          git diff --exit-code infra/terraform/generated

  # ---- terraform fmt + validate (no cloud creds) --------------------------
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
      - name: fmt + validate (all envs, no backend)
        run: |
          set -euo pipefail
          terraform -chdir=infra/terraform fmt -check -recursive
          for env in dev test prod; do
            terraform -chdir="infra/terraform/envs/$env" init -backend=false -input=false
            terraform -chdir="infra/terraform/envs/$env" validate
          done

  # ---- bundle validate + deploy preflight + smoke test --------------------
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Deploy preflight (secret names + service principal; no values)
        run: python pipelines/validate_deployment.py
      - name: Workspace smoke test (no source credentials)
        run: python pipelines/smoke_test.py
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      - name: databricks bundle validate -t dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ -n "${DATABRICKS_HOST:-}" ]; then
            databricks bundle validate -t dev
          else
            echo "no workspace creds in this context; skipping bundle validate"
          fi
