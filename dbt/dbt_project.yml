name: investsphere_payments
version: "2.0.0"
config-version: 2

profile: investsphere_payments

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

# Gold runs on a Databricks SQL warehouse against the trusted Silver tables.
# +catalog makes every model WRITE into the per-env Unity Catalog catalog
# (investsphere_dev/test/prod), supplied as a dbt var from the bundle command.
models:
  investsphere_payments:
    +catalog: "{{ var('catalog', 'investsphere_dev') }}"
    staging:
      +materialized: view
      +schema: gold_staging
    gold:
      +materialized: table
      +schema: gold

    # ---- Enterprise business domains (Dubai Holding-style pivot) --------------
    # Each domain writes to its own Unity Catalog schema. dims/facts are tables;
    # mart_* are the business-question answer surfaces the AI agent's SQL tools hit.
    gold_realestate:
      +materialized: table
      +schema: gold_realestate
    gold_hospitality:
      +materialized: table
      +schema: gold_hospitality
    gold_entertainment:
      +materialized: table
      +schema: gold_entertainment
    gold_investment:
      +materialized: table
      +schema: gold_investment
    gold_customer:
      +materialized: table
      +schema: gold_customer
    gold_ops_trust:
      +materialized: table
      +schema: gold_ops_trust
