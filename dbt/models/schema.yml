version: 2

# Shared customer/guest dimension (SCD2 → current + history). Domain-specific
# tests live in each domain's own _<domain>.yml file under models/gold_<domain>/.
models:
  - name: dim_customer
    description: "Current customer/guest dimension (SCD1-style view of SCD2 current rows)."
    columns:
      - name: customer_id
        description: "Business key."
        data_tests: [not_null, unique]
      - name: status
        data_tests:
          - accepted_values:
              values: ["ACTIVE", "INACTIVE", "CLOSED", "SUSPENDED"]

  - name: dim_customer_history
    description: "SCD2 customer/guest history (as-of / point-in-time)."
    columns:
      - name: customer_id
        data_tests: [not_null]
