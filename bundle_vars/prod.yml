# Bundle variable values for target: prod
#
# Fill from:  terraform -chdir=infra/terraform/envs/prod output -json
#
#   terraform output       ->  bundle var
#   catalog_name           ->  catalog
#   warehouse_id           ->  warehouse_id
#   secret_scope_name      ->  secret_scope
#   etl_service_principal  ->  etl_service_principal   (job run-as — the SPN app id)
catalog: investsphere_prod
secret_scope: investsphere_payments
etl_service_principal: spn_investsphere_etl   # set to the SPN APPLICATION ID in prod
warehouse_id: ""            # REQUIRED before deploy: terraform output -raw warehouse_id

